name: 🤖 Publish Package

on:
  workflow_call:
    inputs:
      version:
        description: 'Set the version number of the published application.'
        default: '0.0.0'
        required: false
        type: string

jobs:
  publish-dist:
    name: Python Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: false

      # Poetry only uploads dist files matching the project version
      - name: Set package version
        run: poetry version "${{ inputs.version }}"

      - name: Fetch build artifact
        uses: actions/download-artifact@v8
        with:
          name: keystone-client-python
          path: dist

      - name: Publish package
        run: poetry publish --repository bhpc
        env:
          POETRY_REPOSITORIES_BHPC_URL: https://artifacts.bhpc.dev/pypi/keystone-python/
          POETRY_HTTP_BASIC_BHPC_USERNAME: ${{ secrets.ARTIFACT_REGISTRY_USERNAME }}
          POETRY_HTTP_BASIC_BHPC_PASSWORD: ${{ secrets.ARTIFACT_REGISTRY_PASSWORD }}

  trigger-docs:
    name: Trigger Docs
    runs-on: ubuntu-latest

    steps:
      - name: Update docs
        uses: better-hpc/keystone-docs/.github/actions/update-action/@main
        with:
          keystone-gitops-id: ${{ secrets.KEYSTONE_GITOPS_ID }}
          keystone-gitops-pk: ${{ secrets.KEYSTONE_GITOPS_PK }}
          repo-name: keystone-python-client
          tag: v${{ inputs.version }}
