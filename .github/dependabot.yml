version: 2

registries:
  bhpc-pypi:
    type: python-index
    url: https://artifacts.bhpc.dev/pypi/pypi/simple/
    username: ${{secrets.ARTIFACT_REGISTRY_USERNAME}}
    password: ${{secrets.ARTIFACT_REGISTRY_PASSWORD}}
    replaces-base: true

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    registries:
      - bhpc-pypi
    insecure-external-code-execution: allow
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns:
          - "*"
